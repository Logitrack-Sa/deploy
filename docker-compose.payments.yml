# Aplicar junto con docker-compose.yml. No publica puertos de pagos ni métricas.
services:
  payment-db-init:
    image: mysql:8.4
    entrypoint: ['sh', '/init/init-payment-db.sh']
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_HOST: mysql
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Configurar contraseña privada de payment_db}
    volumes:
      - ./scripts/init-payment-db.sh:/init/init-payment-db.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - logitrack-net
    deploy:
      resources:
        limits:
          memory: 128M
  security-service:
    environment:
      JWT_AUDIENCES: security-service,courier-service,shipment-service,chatbot-service,payment-service
  api-gateway:
    environment:
      JWT_AUDIENCES: security-service,courier-service,shipment-service,chatbot-service,payment-service
  payment-service:
    build:
      context: ../payment-service
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8085
      MANAGEMENT_SERVER_PORT: 18085
      PAYMENT_DB_URL: jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PAYMENT_DB_USERNAME: payment_app
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_ENABLED: 'true'
      EUREKA_SERVER_URL: http://eureka-server:8065/eureka/
      JWT_PUBLIC_KEY_LOCATION: file:/secrets/public.pem
      JWT_KEY_ID: ${JWT_KEY_ID:-logitrack-main}
      JWT_ISSUER: ${JWT_ISSUER:-https://security-service}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      MERCADOPAGO_SANDBOX: ${MERCADOPAGO_SANDBOX:-true}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      LOGITRACK_PUBLIC_URL: ${LOGITRACK_PUBLIC_URL:-http://localhost:3000}
      JAVA_TOOL_OPTIONS: -XX:+UseSerialGC -Xms64m -Xmx224m -XX:MaxMetaspaceSize=128m
    volumes:
      - ${JWT_CERTS_DIRECTORY:-../certs}:/secrets:ro
      - ./notebook/http-health.sh:/healthcheck/http-health.sh:ro
    healthcheck:
      test: ['CMD', 'bash', '/healthcheck/http-health.sh', '18085']
      interval: 15s
      timeout: 4s
      start_period: 90s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      payment-db-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_started
    networks:
      - logitrack-net
  frontend:
    build:
      args:
        NEXT_PUBLIC_PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
