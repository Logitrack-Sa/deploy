name: logitrack

x-discovery-env: &discovery-env
  EUREKA_CLIENT_ENABLED: "true"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  SERVER_ADDRESS: "0.0.0.0"

services:
  # ==========================================
  # Motor Relacional: MySQL 8.4
  # ==========================================
  mysql:
    image: mysql:8.4
    container_name: logitrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${HOST_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    networks:
      - logitrack-net

  # ==========================================
  # Almacén de Caché en Memoria: Redis 7
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: logitrack-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${HOST_REDIS_PORT:-6379}:6379"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - logitrack-net

  # ==========================================
  # Broker de Mensajería: RabbitMQ
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: logitrack-rabbitmq
    restart: unless-stopped
    ports:
      - "${HOST_RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${HOST_RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER es obligatorio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS es obligatorio}
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logitrack-net

  # ==========================================
  # Servidor de Configuración Centralizada
  # ==========================================
  config-server:
    container_name: logitrack-config-server
    build:
      context: ../config-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_CONFIG_PORT:-8888}:8888"
    environment:
      SERVER_PORT: 8888
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: sprint3
      CONFIG_GIT_LABEL: ${CONFIG_GIT_LABEL:-develop}
      JAVA_OPTS: "-XX:+UseSerialGC -Xms64m -Xmx192m -XX:MaxMetaspaceSize=96m -Djava.security.egd=file:/dev/./urandom"
    deploy:
      resources:
        limits:
          memory: 320M
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8888; printf 'GET /eureka-server/default HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s
    networks:
      - logitrack-net

  # ==========================================
  # Registro y Descubrimiento: Eureka
  # ==========================================
  eureka-server:
    container_name: logitrack-eureka-server
    build:
      context: ../eureka-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_EUREKA_PORT:-8065}:8065"
    environment:
      SERVER_PORT: 8065
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: "http://config-server:8888"
      SERVICE_HOST: eureka-server
      JAVA_OPTS: "-XX:+UseSerialGC -Xms64m -Xmx192m -XX:MaxMetaspaceSize=96m -Djava.security.egd=file:/dev/./urandom"
    deploy:
      resources:
        limits:
          memory: 320M
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8065; printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - logitrack-net

  # ==========================================
  # Microservicio de Seguridad y Autenticación
  # ==========================================
  security-service:
    container_name: logitrack-security-service
    build:
      context: ../security-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_SECURITY_PORT:-8083}:8083"
    environment:
      <<: *discovery-env
      SERVER_PORT: 8083
      MANAGEMENT_SERVER_PORT: 8093
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx224m -XX:MaxMetaspaceSize=128m -Djava.security.egd=file:/dev/./urandom"
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: dev,sprint3,sprint4
      CONFIG_SERVER_URL: "http://config-server:8888"
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_SERVER_URL: "http://eureka-server:8065/eureka/"
      SERVICE_HOST: security-service
      DB_URL: "jdbc:mysql://mysql:3306/security_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      JWT_PRIVATE_KEY_LOCATION: "file:/secrets/private.pem"
      JWT_PUBLIC_KEY_LOCATION: "file:/secrets/public.pem"
      JWT_KEY_ID: ${JWT_KEY_ID:-logitrack-main}
      JWT_ISSUER: ${JWT_ISSUER:-https://security-service}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-security-service,courier-service,shipment-service,chatbot-service}
      JWT_AUDIENCE: security-service
      SECURITY_ADMIN_ENABLED: ${SECURITY_ADMIN_ENABLED:-false}
      SECURITY_ADMIN_EMAIL: ${SECURITY_ADMIN_EMAIL:-admin@logitrack.com}
      SECURITY_ADMIN_USERNAME: ${SECURITY_ADMIN_USERNAME:-admin}
      SECURITY_ADMIN_PASSWORD: ${SECURITY_ADMIN_PASSWORD:-admin123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GMAIL_SMTP_USERNAME: ${GMAIL_SMTP_USERNAME:-}
      GMAIL_SMTP_APP_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - ../certs:/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - logitrack-net

  # ==========================================
  # Microservicio de Repartidores (Couriers)
  # ==========================================
  courier-service:
    container_name: logitrack-courier-service
    build:
      context: ../courier-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_COURIER_PORT:-8082}:8082"
    environment:
      <<: *discovery-env
      SPRING_PROFILES_ACTIVE: dev,sprint3,sprint4
      CONFIG_SERVER_URL: "http://config-server:8888"
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_SERVER_URL: "http://eureka-server:8065/eureka/"
      SERVICE_HOST: courier-service
      SERVER_PORT: 8082
      MANAGEMENT_SERVER_PORT: 8092
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms96m -Xmx224m -XX:MaxMetaspaceSize=128m"
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: "jdbc:mysql://mysql:3306/courier_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER es obligatorio}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS es obligatorio}
      JWT_PUBLIC_KEY_LOCATION: "file:/secrets/public.pem"
      JWT_KEY_ID: ${JWT_KEY_ID:-logitrack-main}
      JWT_ISSUER: ${JWT_ISSUER:-https://security-service}
      JWT_AUDIENCE: courier-service
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - ../certs:/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - logitrack-net

  # ==========================================
  # Microservicio de Envíos (Shipments)
  # ==========================================
  shipment-service:
    container_name: logitrack-shipment-service
    build:
      context: ../shipment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_SHIPMENT_PORT:-8081}:8081"
    environment:
      <<: *discovery-env
      SERVER_PORT: 8081
      MANAGEMENT_SERVER_PORT: 8091
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: dev,sprint3,sprint4
      CONFIG_SERVER_URL: "http://config-server:8888"
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_SERVER_URL: "http://eureka-server:8065/eureka/"
      SERVICE_HOST: shipment-service
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: shipment_db
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      COURIER_SERVICE_URL: ""
      DB_URL: "jdbc:mysql://mysql:3306/shipment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      JWT_PUBLIC_KEY_LOCATION: "file:/secrets/public.pem"
      JWT_KEY_ID: ${JWT_KEY_ID:-logitrack-main}
      JWT_ISSUER: ${JWT_ISSUER:-https://security-service}
      JWT_AUDIENCE: shipment-service
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER es obligatorio}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS es obligatorio}
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    volumes:
      - ../certs:/secrets:ro
    networks:
      - logitrack-net

  # ==========================================
  # Chatbot stateless: consultas con JWT del usuario
  # ==========================================
  chatbot-service:
    container_name: logitrack-chatbot-service
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.chatbot
    restart: unless-stopped
    ports:
      - "${HOST_CHATBOT_PORT:-8084}:8084"
    environment:
      <<: *discovery-env
      SERVER_PORT: 8084
      MANAGEMENT_SERVER_PORT: 8094
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: sprint4
      CONFIG_SERVER_URL: "http://config-server:8888"
      EUREKA_SERVER_URL: "http://eureka-server:8065/eureka/"
      JWT_PUBLIC_KEY_LOCATION: "file:/secrets/public.pem"
      JWT_ISSUER: ${JWT_ISSUER:-https://security-service}
      JWT_KEY_ID: ${JWT_KEY_ID:-logitrack-main}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      AI_COMPLETIONS_PATH: ${AI_COMPLETIONS_PATH:-/chat/completions}
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -XX:+UseSerialGC -Xms32m -Xmx224m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -Xss256k"
    volumes:
      - ${JWT_CERTS_DIRECTORY:-../certs}/public.pem:/secrets/public.pem:ro
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - logitrack-net

  # ==========================================
  # Perímetro: API Gateway
  # ==========================================
  api-gateway:
    container_name: logitrack-api-gateway
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *discovery-env
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8090
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx224m -XX:MaxMetaspaceSize=128m -Djava.security.egd=file:/dev/./urandom"
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: dev,sprint3,sprint4
      CONFIG_SERVER_URL: "http://config-server:8888"
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_SERVER_URL: "http://eureka-server:8065/eureka/"
      SERVICE_HOST: api-gateway
      JWT_PUBLIC_KEY_LOCATION: "file:/secrets/public.pem"
      JWT_KEY_ID: ${JWT_KEY_ID:-logitrack-main}
      JWT_ISSUER: ${JWT_ISSUER:-https://security-service}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-security-service,courier-service,shipment-service,chatbot-service}
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - ../certs:/secrets:ro
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - logitrack-net

  # ==========================================
  # Observabilidad: Prometheus (Métricas)
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: logitrack-prometheus
    restart: unless-stopped
    ports:
      - "${HOST_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=2d'
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      - logitrack-net

  # ==========================================
  # Observabilidad: Grafana (Paneles)
  # ==========================================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: logitrack-grafana
    restart: unless-stopped
    ports:
      - "${HOST_GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 192M
    depends_on:
      - prometheus
    networks:
      - logitrack-net

  frontend:
    image: logitrack-frontend:sprint4-local
    build:
      context: ../logitrack-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: "${FRONTEND_API_GATEWAY_URL:-http://localhost:8080}"
        NEXT_PUBLIC_COURIER_STATUS_MODEL: "${FRONTEND_COURIER_STATUS_MODEL:-legacy}"
        NEXT_PUBLIC_CUSTOMER_CANCELLATION_ENABLED: "${FRONTEND_CUSTOMER_CANCELLATION_ENABLED:-false}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_FRONTEND_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - logitrack-net

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-logitrack_mysql_data}

networks:
  logitrack-net:
    name: ${LOGITRACK_NETWORK_NAME:-logitrack_network}
    driver: bridge
